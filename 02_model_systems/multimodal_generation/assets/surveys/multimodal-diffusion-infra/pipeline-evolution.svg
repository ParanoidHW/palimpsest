<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <style>text{font-family:Arial,SimHei,sans-serif;fill:#17202a;letter-spacing:0}.h{font-size:32px;font-weight:700}.t{font-size:20px;font-weight:700}.b{font-size:16px}.s{font-size:14px;fill:#52616b}.box{stroke:#273746;stroke-width:2;rx:6}.arr{stroke:#273746;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#273746"/></marker></defs>
  <rect width="1500" height="760" fill="#f8f9f9"/><text x="55" y="55" class="h">从 pixel → latent → end-to-end pixel：变化的是压缩位置（整理图）</text>
  <rect x="60" y="105" width="400" height="210" class="box" fill="#f5b7b1"/><text x="85" y="145" class="t">DDPM / pixel U-Net</text><text x="85" y="182" class="b">像素网格反复去噪</text><text x="85" y="214" class="b">优点：无 codec reconstruction ceiling</text><text x="85" y="246" class="b">代价：高分辨率每步成本过高</text><text x="85" y="278" class="s">计算位置：pixel-space U-Net</text>
  <rect x="550" y="105" width="400" height="210" class="box" fill="#abebc6"/><text x="575" y="145" class="t">LDM / Stable Diffusion</text><text x="575" y="182" class="b">VAE 一次压缩，latent 多步去噪</text><text x="575" y="214" class="b">优点：空间 token 约降为 1/f²</text><text x="575" y="246" class="b">代价：独立 codec 有损、两阶段优化</text><text x="575" y="278" class="s">计算位置：frozen latent + U-Net/DiT</text>
  <rect x="1040" y="105" width="400" height="210" class="box" fill="#aed6f1"/><text x="1065" y="145" class="t">PixelDiT / hierarchical pixel</text><text x="1065" y="182" class="b">取消外部 VAE，端到端像素目标</text><text x="1065" y="214" class="b">全局 path 仍做 token compaction</text><text x="1065" y="246" class="b">局部 pixel path 补纹理</text><text x="1065" y="278" class="s">压缩从 codec 移到模型内部</text>
  <path d="M460 210 H548 M950 210 H1038" class="arr"/>
  <text x="70" y="380" class="h">Backbone 与统一模型</text>
  <rect x="60" y="420" width="245" height="185" class="box" fill="#fdebd0"/><text x="85" y="458" class="t">U-Net</text><text x="85" y="492" class="b">多尺度卷积</text><text x="85" y="522" class="b">图像先验强</text><text x="85" y="552" class="b">跨模态扩展较碎片化</text>
  <rect x="350" y="420" width="245" height="185" class="box" fill="#f9e79f"/><text x="375" y="458" class="t">DiT</text><text x="375" y="492" class="b">latent patch transformer</text><text x="375" y="522" class="b">规则 GEMM/attention</text><text x="375" y="552" class="b">易扩展 TP/SP/compile</text>
  <rect x="640" y="420" width="245" height="185" class="box" fill="#d2b4de"/><text x="665" y="458" class="t">MMDiT / dual stream</text><text x="665" y="492" class="b">模态独立投影/MLP</text><text x="665" y="522" class="b">joint attention 交换信息</text><text x="665" y="552" class="b">mask/kernel 更复杂</text>
  <rect x="930" y="420" width="245" height="185" class="box" fill="#a9dfbf"/><text x="955" y="458" class="t">AR + diffusion / MoT</text><text x="955" y="492" class="b">reasoner + generator</text><text x="955" y="522" class="b">共享 token context</text><text x="955" y="552" class="b">阶段与参数路径分离</text>
  <rect x="1220" y="420" width="220" height="185" class="box" fill="#aed6f1"/><text x="1245" y="458" class="t">Dense → MoE</text><text x="1245" y="492" class="b">容量与激活解耦</text><text x="1245" y="522" class="b">all-to-all / expert cache</text><text x="1245" y="552" class="b">路由均衡成为系统项</text>
  <path d="M305 512 H348 M595 512 H638 M885 512 H928 M1175 512 H1218" class="arr"/>
  <rect x="60" y="650" width="1380" height="65" class="box" fill="#fff"/><text x="85" y="690" class="b">收敛判断：transformer 统一了计算原语；但 tokenizer、mask、loss、cache cadence 与输出 codec 仍按模态分化，因此“统一模型”更可能是共享上下文与调度控制面，而不是所有路径完全同构。</text>
</svg>
