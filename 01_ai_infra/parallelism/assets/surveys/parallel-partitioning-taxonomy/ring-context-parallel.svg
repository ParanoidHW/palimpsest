<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ring-title ring-desc">
  <title id="ring-title">Ring Attention and Context Parallel</title><desc id="ring-desc">展示固定 local Q、KV block 环传、online softmax 状态以及 causal 三角负载不均。</desc>
  <defs><marker id="ring-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.rank{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.state{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.bubble{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:6;marker-end:url(#ring-arrow)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}.work{fill:#2474c6}.skip{fill:#f3c7c7}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">Ring / Context Parallel：Q 固定，KV blocks 走一圈</text><text class="st" x="70" y="101">p=4；每 rank 持 local Qᵢ，依次接收所有 Kⱼ/Vⱼ，以 online softmax 合并精确结果。</text>
  <g><rect class="rank" x="150" y="180" width="270" height="125" rx="6"/><rect class="rank" x="1180" y="180" width="270" height="125" rx="6"/><rect class="rank" x="1180" y="520" width="270" height="125" rx="6"/><rect class="rank" x="150" y="520" width="270" height="125" rx="6"/>
  <text class="h" x="215" y="220">rank 0</text><text class="b" x="185" y="257">Q₀ fixed · K₀/V₀ current</text><text class="h" x="1245" y="220">rank 1</text><text class="b" x="1215" y="257">Q₁ fixed · K₁/V₁ current</text><text class="h" x="1245" y="560">rank 2</text><text class="b" x="1215" y="597">Q₂ fixed · K₂/V₂ current</text><text class="h" x="215" y="560">rank 3</text><text class="b" x="185" y="597">Q₃ fixed · K₃/V₃ current</text></g>
  <path class="arr" d="M420 242H1170"/><path class="arr" d="M1315 305V510"/><path class="arr" d="M1180 582H430"/><path class="arr" d="M285 520V315"/>
  <rect class="state" x="560" y="320" width="480" height="200" rx="6"/><text class="h" x="665" y="365">Online softmax state</text><text class="b" x="625" y="408">running max mᵢ</text><text class="b" x="625" y="443">denominator ℓᵢ</text><text class="b" x="625" y="478">weighted numerator oᵢ</text><text class="s" x="610" y="505">收到每个 KV block 后增量更新</text>
  <text class="h" x="70" y="715">Causal workload：有效 block 数呈三角形</text>
  <g transform="translate(590 650)"><rect class="work" x="0" y="0" width="42" height="42"/><rect class="skip" x="48" y="0" width="42" height="42"/><rect class="skip" x="96" y="0" width="42" height="42"/><rect class="skip" x="144" y="0" width="42" height="42"/><rect class="work" x="0" y="48" width="42" height="42"/><rect class="work" x="48" y="48" width="42" height="42"/><rect class="skip" x="96" y="48" width="42" height="42"/><rect class="skip" x="144" y="48" width="42" height="42"/><rect class="work" x="0" y="96" width="42" height="42"/><rect class="work" x="48" y="96" width="42" height="42"/><rect class="work" x="96" y="96" width="42" height="42"/><rect class="skip" x="144" y="96" width="42" height="42"/><rect class="work" x="0" y="144" width="42" height="42"/><rect class="work" x="48" y="144" width="42" height="42"/><rect class="work" x="96" y="144" width="42" height="42"/><rect class="work" x="144" y="144" width="42" height="42"/></g>
  <rect class="note" x="850" y="695" width="600" height="130" rx="6"/><text class="b" x="880" y="730">通信：p−1 neighbor steps / layer</text><text class="s" x="880" y="760">峰值：local Q + current/next KV + online state + buffers。</text><text class="s" x="880" y="790">失效：block compute 遮不住 P2P，或 causal max-rank work 主导。</text><text class="s" x="880" y="815">Decode 的 KV cache ownership 与请求调度需另算。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · ring 通信量相近不意味着 causal compute 均衡</text>
</svg>
