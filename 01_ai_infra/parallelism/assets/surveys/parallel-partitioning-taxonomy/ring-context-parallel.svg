<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ring2-title ring2-desc">
  <title id="ring2-title">Ring Context Parallel 的 Q 和 KV block tensor 表达</title><desc id="ring2-desc">展示 Q_i 固定、K_j V_j 环传、block attention equation 和 online softmax 合并。</desc>
  <defs><marker id="ring2-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.q{fill:#cfe6ff}.kv{fill:#ffe5cd}.state{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:5;marker-end:url(#ring2-arr)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}.work{fill:#2474c6}.skip{fill:#f3c7c7}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">Ring / CP：固定 Qᵢ tensor，逐步替换当前 Kⱼ,Vⱼ tensor</text><text class="st" x="60" y="94">Q,K,V:[B,S,A,dₕ] 沿 S 切成 p=4 blocks。每 rank 最终必须让 Qᵢ 与所有 KV blocks 发生一次 block attention。</text>
  <text class="h" x="60" y="145">Global sequence tensors</text>
  <g transform="translate(80 175)"><rect class="tensor" width="420" height="105"/><rect class="q" x="2" y="2" width="103" height="101"/><rect class="q" x="106" y="2" width="103" height="101"/><rect class="q" x="210" y="2" width="103" height="101"/><rect class="q" x="314" y="2" width="104" height="101"/><text class="h" x="190" y="47">Q</text><text class="b" x="158" y="78">[B,S,A,dₕ]</text></g>
  <g transform="translate(80 300)"><rect class="tensor" width="420" height="105"/><rect class="kv" x="2" y="2" width="103" height="101"/><rect class="kv" x="106" y="2" width="103" height="101"/><rect class="kv" x="210" y="2" width="103" height="101"/><rect class="kv" x="314" y="2" width="104" height="101"/><text class="h" x="180" y="47">K,V</text><text class="b" x="158" y="78">[B,S,A,dₕ]</text></g><text class="s" x="95" y="435">每个色块：[B,S/p,A,dₕ]</text><path class="arr" d="M500 290H590"/>
  <text class="h" x="600" y="145">rank i local state at ring step j</text><rect class="tensor" x="610" y="180" width="255" height="105"/><rect class="q" x="612" y="182" width="251" height="101"/><text class="h" x="690" y="222">Qᵢ fixed</text><text class="b" x="650" y="255">[B,S/p,A,dₕ]</text>
  <rect class="tensor" x="610" y="310" width="255" height="105"/><rect class="kv" x="612" y="312" width="251" height="101"/><text class="h" x="665" y="352">Kⱼ,Vⱼ current</text><text class="b" x="650" y="385">[B,S/p,A,dₕ]</text><path class="arr" d="M865 297H950"/>
  <rect class="comm" x="965" y="180" width="355" height="235" rx="5"/><text class="h" x="1015" y="222">Block operator</text><text class="b" x="1005" y="262">scoresᵢⱼ = QᵢKⱼᵀ / √dₕ</text><text class="b" x="1005" y="300">Oᵢⱼ = softmax(scoresᵢⱼ)Vⱼ</text><text class="s" x="1005" y="338">online update：(mᵢ,ℓᵢ,oᵢ)</text><text class="s" x="1005" y="370">j = i, i−1, … 共 p blocks</text><path class="arr" d="M1320 297H1390"/>
  <rect class="state" x="1400" y="180" width="140" height="235" rx="5"/><text class="h" x="1425" y="222">Oᵢ</text><text class="s" x="1418" y="257">running max</text><text class="s" x="1418" y="287">denominator</text><text class="s" x="1418" y="317">numerator</text><text class="b" x="1418" y="365">[B,S/p,A,dₕ]</text>
  <line x1="60" y1="500" x2="1540" y2="500" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="545">KV ownership rotates；Q ownership does not</text>
  <g><rect class="tensor" x="90" y="580" width="235" height="100"/><text class="b" x="155" y="615">rank 0</text><text class="s" x="125" y="648">Q₀ · current KV₀</text><rect class="tensor" x="470" y="580" width="235" height="100"/><text class="b" x="535" y="615">rank 1</text><text class="s" x="505" y="648">Q₁ · current KV₁</text><rect class="tensor" x="850" y="580" width="235" height="100"/><text class="b" x="915" y="615">rank 2</text><text class="s" x="885" y="648">Q₂ · current KV₂</text><rect class="tensor" x="1230" y="580" width="235" height="100"/><text class="b" x="1295" y="615">rank 3</text><text class="s" x="1265" y="648">Q₃ · current KV₃</text></g><path class="arr" d="M325 630H460"/><path class="arr" d="M705 630H840"/><path class="arr" d="M1085 630H1220"/><path class="arr" d="M1345 680V700H210V690"/>
  <text class="h" x="60" y="775">Causal valid block matrix</text><g transform="translate(330 715) scale(.78)"><rect class="work" x="0" y="0" width="36" height="36"/><rect class="skip" x="42" y="0" width="36" height="36"/><rect class="skip" x="84" y="0" width="36" height="36"/><rect class="skip" x="126" y="0" width="36" height="36"/><rect class="work" x="0" y="42" width="36" height="36"/><rect class="work" x="42" y="42" width="36" height="36"/><rect class="skip" x="84" y="42" width="36" height="36"/><rect class="skip" x="126" y="42" width="36" height="36"/><rect class="work" x="0" y="84" width="36" height="36"/><rect class="work" x="42" y="84" width="36" height="36"/><rect class="work" x="84" y="84" width="36" height="36"/><rect class="skip" x="126" y="84" width="36" height="36"/><rect class="work" x="0" y="126" width="36" height="36"/><rect class="work" x="42" y="126" width="36" height="36"/><rect class="work" x="84" y="126" width="36" height="36"/><rect class="work" x="126" y="126" width="36" height="36"/></g>
  <rect class="note" x="570" y="740" width="970" height="95" rx="5"/><text class="b" x="600" y="775">通信：p−1 neighbor transfers/layer；峰值：Qᵢ + current/next KV + online state + buffers。</text><text class="s" x="600" y="807">蓝/红三角矩阵说明 causal compute 不均衡；相同 KV 流量不代表相同 max-rank FLOPs。Decode KV cache ownership 需另算。</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · tensor block equation 明确每一步究竟是哪组 Q/K/V 相乘</text>
</svg>
