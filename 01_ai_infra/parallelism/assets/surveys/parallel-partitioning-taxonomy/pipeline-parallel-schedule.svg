<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="pp2-title pp2-desc">
  <title id="pp2-title">Pipeline Parallel 的 layer tensor 与 activation tensor 表达</title><desc id="pp2-desc">以参数沿 layer 轴切分、stage function 和 micro-batch activation tensor 展示 pipeline parallel。</desc>
  <defs><marker id="pp2-arr-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker><marker id="pp2-arr-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2474c6"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.c0{fill:#cfe6ff}.c1{fill:#fff0c7}.c2{fill:#f5cccc}.c3{fill:#ffe5cd}.stage{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.fwd{fill:#cfe6ff;stroke:#2474c6}.bwd{fill:#dff3e5;stroke:#2f9254}.bubble{fill:#fff0f0;stroke:#d64b4b;stroke-dasharray:7 5}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#pp2-arr-o)}.barr{fill:none;stroke:#2474c6;stroke-width:3;marker-end:url(#pp2-arr-b)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">PP：参数沿 layer 轴切，activation tensor 沿 stage 边界流动</text><text class="st" x="60" y="94">p=4 stages，M=4 micro-batches。每个 stage 是局部函数 Fᵢ；tensor shape 不变不代表 ownership 不变。</text>
  <text class="h" x="60" y="145">Global parameter tensor Ψ[L,…] → layer-axis shards</text>
  <g transform="translate(80 175)"><rect class="tensor" width="320" height="125"/><rect class="c0" x="2" y="2" width="78" height="121"/><rect class="c1" x="81" y="2" width="78" height="121"/><rect class="c2" x="160" y="2" width="78" height="121"/><rect class="c3" x="239" y="2" width="79" height="121"/><text class="h" x="145" y="55">Ψ</text><text class="b" x="110" y="88">[L,…]</text><text class="s" x="20" y="115">Ψ₀</text><text class="s" x="100" y="115">Ψ₁</text><text class="s" x="180" y="115">Ψ₂</text><text class="s" x="260" y="115">Ψ₃</text></g>
  <text class="t" x="435" y="250">:</text><text class="b" x="470" y="218">F = F₃ ∘ F₂ ∘ F₁ ∘ F₀</text><text class="b" x="470" y="255">Ψᵢ ≈ Ψ/p · rank i owns one stage</text><text class="s" x="470" y="285">optimizer state follows the same stage owner</text>
  <text class="h" x="900" y="145">Micro-batch activation tensor</text><g transform="translate(925 175)"><rect class="tensor" width="260" height="125"/><text class="h" x="112" y="54">Xᵐ</text><text class="b" x="72" y="86">[B/M,S,H]</text></g><path class="arr" d="M1185 238H1280"/><rect class="stage" x="1295" y="175" width="245" height="125" rx="5"/><text class="h" x="1335" y="218">boundary payload</text><text class="b" x="1335" y="252">q·B·S·H/M bytes</text><text class="s" x="1335" y="278">FWD X / BWD ∂X</text>
  <line x1="60" y1="350" x2="1540" y2="350" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="395">rank-local tensor equation</text>
  <g transform="translate(85 430)"><rect class="stage" width="260" height="115" rx="5"/><text class="h" x="73" y="38">rank 0 · F₀</text><text class="b" x="38" y="73">X₁ᵐ = F₀(X₀ᵐ;Ψ₀)</text><text class="s" x="58" y="99">[B/M,S,H]</text></g><path class="arr" d="M345 487H420"/>
  <g transform="translate(430 430)"><rect class="stage" width="260" height="115" rx="5"/><text class="h" x="73" y="38">rank 1 · F₁</text><text class="b" x="38" y="73">X₂ᵐ = F₁(X₁ᵐ;Ψ₁)</text><text class="s" x="58" y="99">[B/M,S,H]</text></g><path class="arr" d="M690 487H765"/>
  <g transform="translate(775 430)"><rect class="stage" width="260" height="115" rx="5"/><text class="h" x="73" y="38">rank 2 · F₂</text><text class="b" x="38" y="73">X₃ᵐ = F₂(X₂ᵐ;Ψ₂)</text><text class="s" x="58" y="99">[B/M,S,H]</text></g><path class="arr" d="M1035 487H1110"/>
  <g transform="translate(1120 430)"><rect class="stage" width="260" height="115" rx="5"/><text class="h" x="73" y="38">rank 3 · F₃</text><text class="b" x="38" y="73">Yᵐ = F₃(X₃ᵐ;Ψ₃)</text><text class="s" x="58" y="99">[B/M,S,H]</text></g><path class="barr" d="M1250 560H215"/><text class="s" x="650" y="582">backward：∂Xᵐ 沿反方向 P2P</text>
  <text class="h" x="60" y="635">Time axis：同一 stage 同时只处理一个 micro-batch tensor</text>
  <g transform="translate(180 665)"><text class="s" x="-85" y="28">S0</text><text class="s" x="-85" y="75">S1</text><text class="s" x="-85" y="122">S2</text><text class="s" x="-85" y="169">S3</text><g class="fwd"><rect x="0" y="0" width="135" height="35"/><rect x="140" y="0" width="135" height="35"/><rect x="280" y="0" width="135" height="35"/><rect x="420" y="0" width="135" height="35"/><rect x="140" y="47" width="135" height="35"/><rect x="280" y="47" width="135" height="35"/><rect x="420" y="47" width="135" height="35"/><rect x="560" y="47" width="135" height="35"/><rect x="280" y="94" width="135" height="35"/><rect x="420" y="94" width="135" height="35"/><rect x="560" y="94" width="135" height="35"/><rect x="700" y="94" width="135" height="35"/><rect x="420" y="141" width="135" height="35"/><rect x="560" y="141" width="135" height="35"/><rect x="700" y="141" width="135" height="35"/><rect x="840" y="141" width="135" height="35"/></g><g class="bubble"><rect x="0" y="47" width="135" height="35"/><rect x="0" y="94" width="275" height="35"/><rect x="0" y="141" width="415" height="35"/></g><text class="s" x="47" y="24">X¹</text><text class="s" x="187" y="24">X²</text><text class="s" x="327" y="24">X³</text><text class="s" x="467" y="24">X⁴</text></g>
  <rect class="note" x="1190" y="650" width="350" height="155" rx="5"/><text class="b" x="1220" y="686">U ≈ M/(M+p−1)</text><text class="s" x="1220" y="718">bubble、最慢 stage、checkpoint</text><text class="s" x="1220" y="746">重计算与 boundary buffer 单列。</text><text class="s" x="1220" y="777">Serving 需按请求/token schedule 重算。</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · 视觉表达参考 Colossal-AI layer-per-GPU 图并加入 activation tensor shape 与 micro-batch ownership</text>
</svg>
