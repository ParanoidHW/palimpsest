<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="pp-title pp-desc">
  <title id="pp-title">Pipeline Parallel stages 与 micro-batch schedule</title><desc id="pp-desc">展示层切 stage、前反向 P2P、micro-batch 流水线及 bubble。</desc>
  <defs><marker id="pp-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.stage{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.f{fill:#cfe6ff;stroke:#2474c6}.bwd{fill:#dff3e5;stroke:#2f9254}.bubble{fill:#fff0f0;stroke:#d64b4b;stroke-dasharray:7 5}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#pp-arrow)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">PP：切 layers 之后，还要切时间</text><text class="st" x="70" y="101">p=4 stages，M=4 micro-batches；橙色箭头为 stage-boundary activation / gradient P2P。</text>
  <text class="h" x="70" y="160">Layer placement</text>
  <g><rect class="stage" x="90" y="185" width="260" height="85" rx="6"/><rect class="stage" x="430" y="185" width="260" height="85" rx="6"/><rect class="stage" x="770" y="185" width="260" height="85" rx="6"/><rect class="stage" x="1110" y="185" width="260" height="85" rx="6"/>
  <text class="b" x="155" y="235">S0 · layers 0…k</text><text class="b" x="495" y="235">S1 · layers k…</text><text class="b" x="835" y="235">S2 · layers …</text><text class="b" x="1175" y="235">S3 · final layers</text></g>
  <path class="arr" d="M350 228H420"/><path class="arr" d="M690 228H760"/><path class="arr" d="M1030 228H1100"/>
  <text class="h" x="70" y="345">FWD/BWD schedule（示意）</text><text class="s" x="1320" y="345">time →</text>
  <g transform="translate(150 375)"><text class="b" x="-80" y="38">S0</text><text class="b" x="-80" y="118">S1</text><text class="b" x="-80" y="198">S2</text><text class="b" x="-80" y="278">S3</text>
  <g class="bubble"><rect x="0" y="0" width="160" height="55"/><rect x="0" y="80" width="160" height="55"/><rect x="0" y="160" width="320" height="55"/><rect x="0" y="240" width="480" height="55"/></g>
  <g class="f"><rect x="0" y="0" width="150" height="55"/><rect x="160" y="0" width="150" height="55"/><rect x="320" y="0" width="150" height="55"/><rect x="480" y="0" width="150" height="55"/><rect x="160" y="80" width="150" height="55"/><rect x="320" y="80" width="150" height="55"/><rect x="480" y="80" width="150" height="55"/><rect x="640" y="80" width="150" height="55"/><rect x="320" y="160" width="150" height="55"/><rect x="480" y="160" width="150" height="55"/><rect x="640" y="160" width="150" height="55"/><rect x="800" y="160" width="150" height="55"/><rect x="480" y="240" width="150" height="55"/><rect x="640" y="240" width="150" height="55"/><rect x="800" y="240" width="150" height="55"/><rect x="960" y="240" width="150" height="55"/></g>
  <g class="bwd"><rect x="640" y="0" width="150" height="55"/><rect x="800" y="0" width="150" height="55"/><rect x="960" y="0" width="150" height="55"/><rect x="1120" y="0" width="150" height="55"/><rect x="800" y="80" width="150" height="55"/><rect x="960" y="80" width="150" height="55"/><rect x="1120" y="80" width="150" height="55"/><rect x="960" y="160" width="150" height="55"/><rect x="1120" y="160" width="150" height="55"/><rect x="1120" y="240" width="150" height="55"/></g>
  <text class="s" x="45" y="35">F1</text><text class="s" x="205" y="35">F2</text><text class="s" x="685" y="35">B1</text><text class="s" x="845" y="35">B2</text></g>
  <rect class="note" x="90" y="715" width="1280" height="90" rx="6"/><text class="b" x="120" y="748">理想均衡利用率 U = M/(M+p−1)，bubble = (p−1)/(M+p−1)（analysis-derived，未计 overlap）</text><text class="s" x="120" y="778">每 rank 约 1/p layer FLOPs；额外代价来自 bubble、最慢 stage、activation P2P，以及 activation checkpoint 的重计算。</text>
  <text class="s" x="70" y="868">教学整理图，非论文原图 · 推理需区分 prefill pipeline、decode token pipeline 与请求调度；训练公式不能直接套用</text>
</svg>
