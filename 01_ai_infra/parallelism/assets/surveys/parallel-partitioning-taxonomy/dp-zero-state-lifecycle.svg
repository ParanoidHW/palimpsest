<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="dp2-title dp2-desc">
  <title id="dp2-title">DP 与 ZeRO 的 tensor 切分表达</title><desc id="dp2-desc">以全局 batch tensor、rank-local batch shards、gradient sum 和模型状态 shards 表达 DP 与 ZeRO。</desc>
  <defs><marker id="dp2-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:14px}.axis{font-size:14px;fill:#7653b5}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.c0{fill:#cfe6ff}.c1{fill:#dff3e5}.c2{fill:#f2e7ff}.c3{fill:#ffe5cd}.state{fill:#eef0f3;stroke:#7b8494;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.peak{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#dp2-arr)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">DP / ZeRO：先看 tensor 沿哪个轴被切</text><text class="st" x="60" y="94">固定全局 workload，p=4。上半部分切 batch tensor；下半部分切 parameter / gradient / optimizer state。</text>
  <text class="h" x="60" y="145">全局 batch tensor</text><text class="axis" x="83" y="178">B axis ↓</text>
  <g transform="translate(80 195)"><rect class="tensor" width="250" height="240"/><rect class="c0" x="2" y="2" width="246" height="57"/><rect class="c1" x="2" y="61" width="246" height="57"/><rect class="c2" x="2" y="120" width="246" height="57"/><rect class="c3" x="2" y="179" width="246" height="59"/><text class="h" x="78" y="110">X</text><text class="b" x="61" y="140">[B,S,H]</text></g>
  <text class="b" x="90" y="465">X = concat<tspan baseline-shift="sub">B</tspan>(X₀,X₁,X₂,X₃)</text><path class="arr" d="M330 315H405"/>
  <text class="h" x="420" y="145">rank-local tensors</text>
  <g transform="translate(420 190)"><g><rect class="tensor" x="0" y="0" width="210" height="92"/><rect class="c0" x="2" y="2" width="206" height="88"/><text class="b" x="55" y="38">rank 0 · X₀</text><text class="s" x="49" y="67">[B/p,S,H]</text></g><g transform="translate(230 0)"><rect class="tensor" width="210" height="92"/><rect class="c1" x="2" y="2" width="206" height="88"/><text class="b" x="55" y="38">rank 1 · X₁</text><text class="s" x="49" y="67">[B/p,S,H]</text></g><g transform="translate(0 115)"><rect class="tensor" width="210" height="92"/><rect class="c2" x="2" y="2" width="206" height="88"/><text class="b" x="55" y="38">rank 2 · X₂</text><text class="s" x="49" y="67">[B/p,S,H]</text></g><g transform="translate(230 115)"><rect class="tensor" width="210" height="92"/><rect class="c3" x="2" y="2" width="206" height="88"/><text class="b" x="55" y="38">rank 3 · X₃</text><text class="s" x="49" y="67">[B/p,S,H]</text></g></g>
  <text class="b" x="445" y="435">Gᵢ = ∇W ℒ(Xᵢ;W)</text><path class="arr" d="M880 315H965"/>
  <rect class="comm" x="980" y="190" width="520" height="245" rx="5"/><text class="h" x="1020" y="230">Gradient recovery</text><text class="t" x="1030" y="295">G = Σᵢ Gᵢ</text><text class="b" x="1030" y="335">All-Reduce：[Ψ] → [Ψ] on every rank</text><text class="s" x="1030" y="370">W 完整复制；每 rank 计算约全局 batch FLOPs / p</text><text class="s" x="1030" y="400">ring payload ≈ 2(p−1)qΨ/p bytes/rank</text>
  <line x1="60" y1="515" x2="1540" y2="515" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="560">ZeRO：状态 tensor 的 ownership</text>
  <text class="b" x="80" y="615">DP</text><rect class="state" x="175" y="583" width="1120" height="48"/><text class="b" x="200" y="614">rank r : P[Ψ] + G[Ψ] + O[κΨ]（全部复制）</text>
  <text class="b" x="80" y="680">Z1</text><rect class="state" x="175" y="648" width="1120" height="48"/><text class="b" x="200" y="679">rank r : P[Ψ] + G[Ψ] + Oᵣ[κΨ/p]</text>
  <text class="b" x="80" y="745">Z2</text><rect class="state" x="175" y="713" width="1120" height="48"/><text class="b" x="200" y="744">rank r : P[Ψ] + Gᵣ[Ψ/p] + Oᵣ[κΨ/p]</text>
  <text class="b" x="80" y="810">Z3</text><rect class="state" x="175" y="778" width="1120" height="48"/><text class="b" x="200" y="809">rank r : Pᵣ[Ψ/p] + Gᵣ[Ψ/p] + Oᵣ[κΨ/p]</text><path class="arr" d="M1300 802H1370"/><rect class="peak" x="1380" y="750" width="160" height="90" rx="5"/><text class="s" x="1400" y="780">layer ℓ 使用前</text><text class="b" x="1400" y="808">AG(Pᵣ) → Pℓ</text><text class="s" x="1400" y="831">临时峰值 buffer</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · tensor 尺寸表示 ownership，不表示物理显存比例</text>
</svg>
