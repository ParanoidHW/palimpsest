<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cfg-title cfg-desc">
  <title id="cfg-title">Classifier-Free Guidance branch parallelism</title><desc id="cfg-desc">展示条件分支分发、分支本地执行、guidance combine 与权重和 cache 复制。</desc>
  <defs><marker id="cfg-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.branch{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.layout{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.state{fill:#eef0f3;stroke:#7b8494;stroke-width:2}.sync{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.good{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:5;marker-end:url(#cfg-arrow)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">CFGP：切条件分支，不减少总 FLOPs</text><text class="st" x="70" y="101">conditional / unconditional 并发执行；目标是降低 wall time，而不是消除两条分支的计算。</text>
  <rect class="layout" x="80" y="190" width="300" height="135" rx="6"/><text class="h" x="130" y="235">共享输入 xₜ, t</text><text class="b" x="120" y="273">condition c / null ∅</text><text class="s" x="120" y="302">branch dispatch</text>
  <path class="arr" d="M380 235H520V190"/><path class="arr" d="M380 280H520V420"/>
  <rect class="branch" x="535" y="145" width="420" height="185" rx="6"/><text class="h" x="575" y="190">rank 0 · conditional</text><text class="b" x="575" y="230">εc = fθ(xₜ,t,c)</text><rect class="state" x="575" y="255" width="330" height="48" rx="5"/><text class="s" x="600" y="285">复制 weights / cache / runtime state</text>
  <rect class="branch" x="535" y="375" width="420" height="185" rx="6"/><text class="h" x="575" y="420">rank 1 · unconditional</text><text class="b" x="575" y="460">εu = fθ(xₜ,t,∅)</text><rect class="state" x="575" y="485" width="330" height="48" rx="5"/><text class="s" x="600" y="515">复制 weights / cache / runtime state</text>
  <path class="arr" d="M955 235H1090V315"/><path class="arr" d="M955 465H1090V365"/><rect class="sync" x="1105" y="265" width="405" height="150" rx="6"/><text class="h" x="1165" y="308">Guidance Combine</text><text class="b" x="1150" y="347">ε = εu + w(εc − εu)</text><text class="s" x="1150" y="380">exchange / gather branch outputs</text>
  <path class="arr" d="M1305 415V510"/><rect class="comm" x="1105" y="525" width="405" height="80" rx="6"/><text class="b" x="1170" y="558">进入下一 denoising step</text><text class="s" x="1170" y="585">每 step 重复同步边界</text>
  <rect class="good" x="80" y="660" width="655" height="120" rx="6"/><text class="h" x="110" y="699">固定 workload 的计算口径</text><text class="s" x="110" y="730">总 FLOPs ≈ 两分支串行执行总和，不因 p=2 消失。</text><text class="s" x="110" y="758">理想每 rank 约 1/2 branch FLOPs，wall time 接近较慢分支。</text>
  <rect class="note" x="765" y="660" width="745" height="120" rx="6"/><text class="h" x="795" y="699">失效条件与推理差异</text><text class="s" x="795" y="730">分支不均、combine tensor 过大、权重/cache 复制 OOM、同步无法与下一步重叠。</text><text class="s" x="795" y="758">这是 diffusion inference 路径；训练时的 CFG dropout 不等同于双分支 CFGP。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · 灰色复制状态必须计入每 rank 与总集群内存</text>
</svg>
