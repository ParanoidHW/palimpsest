<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="cfg2-title cfg2-desc">
  <title id="cfg2-title">CFGP 的 condition-axis tensor 切分</title><desc id="cfg2-desc">以新增 condition 轴 C=2 的 tensor、branch-local model output 和 guidance combine 表达 CFG parallel。</desc>
  <defs><marker id="cfg2-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.axis{font-size:14px;fill:#7653b5}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.cond{fill:#cfe6ff}.uncond{fill:#f2e7ff}.model{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.state{fill:#eef0f3;stroke:#7b8494;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.sync{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#cfg2-arr)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">CFGP：把 condition 视为显式 tensor axis</text><text class="st" x="60" y="94">构造 Xcfg[C=2,B,S,H]，C={conditional, unconditional}。沿 C 切分后，两条 branch 在不同 ranks 上执行同一 fθ。</text>
  <text class="h" x="60" y="145">Global branch tensor</text><text class="axis" x="85" y="178">C axis ↓</text><g transform="translate(80 195)"><rect class="tensor" width="330" height="220"/><rect class="cond" x="2" y="2" width="326" height="106"/><rect class="uncond" x="2" y="110" width="326" height="108"/><text class="h" x="125" y="50">Xcfg</text><text class="b" x="100" y="80">[2,B,S,H]</text><text class="b" x="35" y="135">c=0 · Xc=[xₜ,t,c]</text><text class="b" x="35" y="185">c=1 · Xu=[xₜ,t,∅]</text></g><text class="b" x="100" y="450">Xcfg = stack<tspan baseline-shift="sub">C</tspan>(Xc,Xu)</text><path class="arr" d="M410 305H500"/>
  <text class="h" x="510" y="145">rank-local branch tensors</text><rect class="tensor" x="520" y="190" width="285" height="105"/><rect class="cond" x="522" y="192" width="281" height="101"/><text class="b" x="575" y="230">rank 0 · Xc[B,S,H]</text><text class="s" x="575" y="264">εc = fθ(Xc)</text><rect class="tensor" x="520" y="320" width="285" height="105"/><rect class="uncond" x="522" y="322" width="281" height="101"/><text class="b" x="575" y="360">rank 1 · Xu[B,S,H]</text><text class="s" x="575" y="394">εu = fθ(Xu)</text>
  <rect class="state" x="845" y="190" width="260" height="235" rx="5"/><text class="h" x="895" y="232">replicated state</text><text class="b" x="885" y="272">θ[Ψ] on rank 0</text><text class="b" x="885" y="310">θ[Ψ] on rank 1</text><text class="s" x="885" y="350">side cost only:</text><text class="s" x="885" y="376">weights / cache duplicated</text><path d="M805 243H825V372H805" fill="none" stroke="#e87927" stroke-width="4"/><path class="arr" d="M825 372V465H1165V350H1180"/>
  <rect class="comm" x="1195" y="190" width="345" height="235" rx="5"/><text class="h" x="1250" y="232">Gather along C</text><text class="t" x="1235" y="292">E = stack(εc,εu)</text><text class="b" x="1260" y="335">E:[2,B,S,H]</text><text class="s" x="1235" y="375">每 denoising step 一次</text>
  <line x1="60" y1="510" x2="1540" y2="510" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="555">恢复 guidance 语义：在 condition axis 上做线性组合</text>
  <g transform="translate(80 590)"><rect class="tensor" width="270" height="150"/><rect class="cond" x="2" y="2" width="266" height="72"/><rect class="uncond" x="2" y="76" width="266" height="72"/><text class="b" x="70" y="44">εc [B,S,H]</text><text class="b" x="70" y="119">εu [B,S,H]</text></g><path class="arr" d="M350 665H450"/>
  <rect class="sync" x="465" y="575" width="550" height="180" rx="5"/><text class="h" x="535" y="618">Guidance operator</text><text class="t" x="525" y="680">ε = εu + w(εc − εu)</text><text class="b" x="560" y="720">输出 ε:[B,S,H] · C axis 被消去</text><path class="arr" d="M1015 665H1105"/>
  <g transform="translate(1120 590)"><rect class="tensor" width="260" height="150"/><text class="h" x="112" y="62">ε</text><text class="b" x="78" y="98">[B,S,H]</text><text class="s" x="58" y="127">next denoising step</text></g>
  <rect class="note" x="1410" y="565" width="130" height="200" rx="5"/><text class="s" x="1427" y="598">总 FLOPs</text><text class="b" x="1427" y="630">不变</text><text class="s" x="1427" y="672">rank ≈ 1/2</text><text class="s" x="1427" y="704">wall time</text><text class="s" x="1427" y="736">取慢分支</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · 训练中的 CFG dropout 不等同于 C=2 双分支并发推理</text>
</svg>
