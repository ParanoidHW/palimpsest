<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="msp-title msp-desc">
  <title id="msp-title">Megatron Sequence Parallel activation sharding</title><desc id="msp-desc">展示非 attention activation 沿 sequence 分片及与 TP 边界的 gather 和 reduce-scatter。</desc>
  <defs><marker id="msp-arrow-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker><marker id="msp-arrow-p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7653b5"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.seq{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.compute{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.local{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:5;marker-end:url(#msp-arrow-o)}.parr{fill:none;stroke:#7653b5;stroke-width:4;marker-end:url(#msp-arrow-p)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">Megatron Sequence Parallel：切非 attention activation</text><text class="st" x="70" y="101">它与 Tensor Parallel 共用 TP group；核心是让 LayerNorm / dropout / residual 等按 S/p 保存与执行。</text>
  <text class="h" x="70" y="165">sequence-sharded region</text>
  <g><rect class="seq" x="80" y="195" width="230" height="100" rx="6"/><rect class="seq" x="330" y="195" width="230" height="100" rx="6"/><rect class="seq" x="580" y="195" width="230" height="100" rx="6"/><rect class="seq" x="830" y="195" width="230" height="100" rx="6"/>
  <text class="b" x="115" y="235">rank 0 · S/4</text><text class="b" x="365" y="235">rank 1 · S/4</text><text class="b" x="615" y="235">rank 2 · S/4</text><text class="b" x="865" y="235">rank 3 · S/4</text><text class="s" x="105" y="269">LN/dropout/residual</text><text class="s" x="355" y="269">LN/dropout/residual</text><text class="s" x="605" y="269">LN/dropout/residual</text><text class="s" x="855" y="269">LN/dropout/residual</text></g>
  <path class="arr" d="M1060 245H1170"/><rect class="comm" x="1185" y="190" width="300" height="110" rx="6"/><text class="h" x="1255" y="231">All-Gather</text><text class="s" x="1220" y="265">恢复 full S，进入 TP linear</text>
  <path class="parr" d="M1335 300V390"/><rect class="compute" x="1050" y="405" width="435" height="115" rx="6"/><text class="h" x="1115" y="447">Tensor Parallel GEMM / Attention</text><text class="s" x="1115" y="480">权重/hidden/head 按 TP 维切；计算约 1/p</text>
  <path class="arr" d="M1050 463H890"/><rect class="comm" x="570" y="408" width="305" height="110" rx="6"/><text class="h" x="620" y="449">Reduce-Scatter</text><text class="s" x="610" y="482">归约 partials 并恢复 S/p layout</text><path class="parr" d="M570 463H430"/>
  <rect class="local" x="80" y="405" width="335" height="115" rx="6"/><text class="h" x="125" y="447">下一段 local activation</text><text class="s" x="125" y="480">每 rank activation memory 约 1/p</text>
  <rect class="note" x="80" y="610" width="640" height="125" rx="6"/><text class="h" x="110" y="650">节省什么</text><text class="s" x="110" y="683">被 SP 覆盖的非 attention activation 从 O(BSH) 降到 O(BSH/p)。</text><text class="s" x="110" y="713">参数状态通常不因该 SP 单独下降；需与 TP/DP/ZeRO 分开核算。</text>
  <rect class="note" x="750" y="610" width="735" height="125" rx="6"/><text class="h" x="780" y="650">边界与推理差异</text><text class="s" x="780" y="683">每个 Transformer block 的 layout 边界产生 gather / reduce-scatter；不等同于 Ulysses。</text><text class="s" x="780" y="713">训练 activation 收益最明确；decode 的 S=1 新 token 不具同样的 sequence shard 收益。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · 图中省略具体 fused kernel 与 overlap schedule</text>
</svg>
