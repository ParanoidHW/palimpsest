<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="msp2-title msp2-desc">
  <title id="msp2-title">Megatron Sequence Parallel 的 activation tensor 切分</title><desc id="msp2-desc">以 X[B,S,H] 沿 S 轴切分、局部 LayerNorm、all-gather、TP linear 和 reduce-scatter 表达 Megatron SP。</desc>
  <defs><marker id="msp2-arr-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker><marker id="msp2-arr-p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7653b5"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.axis{font-size:14px;fill:#7653b5}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.c0{fill:#cfe6ff}.c1{fill:#dff3e5}.c2{fill:#f2e7ff}.c3{fill:#ffe5cd}.local{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.tp{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#msp2-arr-o)}.parr{fill:none;stroke:#7653b5;stroke-width:4;marker-end:url(#msp2-arr-p)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">Megatron SP：非 TP 区域保留 sequence-sharded tensor</text><text class="st" x="60" y="94">SP 与 TP 共用同一个 p=4 group。LayerNorm / dropout / residual 消费 Xᵢ[B,S/p,H]；linear 边界才恢复完整 S。</text>
  <text class="h" x="60" y="145">Global activation</text><text class="axis" x="80" y="178">S axis ↓</text><g transform="translate(80 195)"><rect class="tensor" width="260" height="280"/><rect class="c0" x="2" y="2" width="256" height="67"/><rect class="c1" x="2" y="70" width="256" height="67"/><rect class="c2" x="2" y="138" width="256" height="67"/><rect class="c3" x="2" y="206" width="256" height="72"/><text class="h" x="112" y="130">X</text><text class="b" x="78" y="160">[B,S,H]</text></g><text class="b" x="85" y="505">X = concat<tspan baseline-shift="sub">S</tspan>(X₀…X₃)</text><path class="parr" d="M340 335H410"/>
  <text class="h" x="420" y="145">rank-local elementwise region</text><g transform="translate(420 190)"><g><rect class="tensor" width="235" height="95"/><rect class="c0" x="2" y="2" width="231" height="91"/><text class="b" x="45" y="36">rank 0 · X₀</text><text class="s" x="38" y="64">[B,S/p,H]</text><text class="s" x="38" y="84">LN/dropout/residual</text></g><g transform="translate(255 0)"><rect class="tensor" width="235" height="95"/><rect class="c1" x="2" y="2" width="231" height="91"/><text class="b" x="45" y="36">rank 1 · X₁</text><text class="s" x="38" y="64">[B,S/p,H]</text><text class="s" x="38" y="84">LN/dropout/residual</text></g><g transform="translate(0 120)"><rect class="tensor" width="235" height="95"/><rect class="c2" x="2" y="2" width="231" height="91"/><text class="b" x="45" y="36">rank 2 · X₂</text><text class="s" x="38" y="64">[B,S/p,H]</text><text class="s" x="38" y="84">LN/dropout/residual</text></g><g transform="translate(255 120)"><rect class="tensor" width="235" height="95"/><rect class="c3" x="2" y="2" width="231" height="91"/><text class="b" x="45" y="36">rank 3 · X₃</text><text class="s" x="38" y="64">[B,S/p,H]</text><text class="s" x="38" y="84">LN/dropout/residual</text></g></g>
  <path class="arr" d="M910 300H985"/><rect class="comm" x="1000" y="205" width="235" height="190" rx="5"/><text class="h" x="1040" y="246">All-Gather S</text><text class="t" x="1040" y="300">Xᵢ → X</text><text class="b" x="1035" y="338">[B,S,H]</text><text class="s" x="1035" y="372">进入 TP linear</text><path class="parr" d="M1235 300H1300"/>
  <rect class="tp" x="1315" y="205" width="225" height="190" rx="5"/><text class="h" x="1350" y="246">TP operator</text><text class="b" x="1345" y="292">Yᵢ = XWᵢ</text><text class="s" x="1345" y="326">Wᵢ:[H,H/p]</text><text class="s" x="1345" y="356">Yᵢ:[B,S,H/p]</text>
  <line x1="60" y1="565" x2="1540" y2="565" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="610">TP 出口同时完成 sum 与 sequence shard</text>
  <rect class="tp" x="80" y="645" width="390" height="115" rx="5"/><text class="b" x="110" y="683">partial Zᵢ = YᵢVᵢ</text><text class="s" x="110" y="716">Zᵢ:[B,S,H] · 每 rank 是部分和</text><text class="s" x="110" y="744">Σᵢ Zᵢ 才是全局输出</text><path class="arr" d="M470 702H555"/>
  <rect class="comm" x="570" y="635" width="370" height="135" rx="5"/><text class="h" x="640" y="675">Reduce-Scatter S</text><text class="t" x="635" y="725">Zᵣ = shard<tspan baseline-shift="sub">S</tspan>(ΣᵢZᵢ)</text><path class="parr" d="M940 702H1025"/>
  <g transform="translate(1040 640)"><rect class="tensor" width="250" height="125"/><rect class="c0" x="2" y="2" width="246" height="121"/><text class="h" x="77" y="48">rank r · Zᵣ</text><text class="b" x="68" y="82">[B,S/p,H]</text><text class="s" x="43" y="108">进入下一 SP region</text></g>
  <rect class="note" x="1320" y="625" width="220" height="155" rx="5"/><text class="b" x="1342" y="662">activation ≈ 1/p</text><text class="s" x="1342" y="694">参数由 TP/ZeRO 决定</text><text class="s" x="1342" y="724">decode S=1 时收益弱</text><text class="s" x="1342" y="754">不等同于 Ulysses</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · 紫色表示 layout/TP 边界，橙色表示 collective</text>
</svg>
