<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="tp2-title tp2-desc">
  <title id="tp2-title">Tensor Parallel 的矩阵切分表达</title><desc id="tp2-desc">以 Y=XA 的 column split 和 Z=sum YiBi 的 row split 表达 Megatron tensor parallel。</desc>
  <defs><marker id="tp2-arr-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker><marker id="tp2-arr-p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7653b5"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:18px}.s{font-size:14px}.axis{font-size:14px;fill:#7653b5}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.c0{fill:#cfe6ff}.c1{fill:#dff3e5}.c2{fill:#f2e7ff}.c3{fill:#ffe5cd}.local{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#tp2-arr-o)}.parr{fill:none;stroke:#7653b5;stroke-width:4;marker-end:url(#tp2-arr-p)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">TP：矩阵切分方向决定 collective 在哪里</text><text class="st" x="60" y="94">令 T=B·S。先 column-split 第一层权重，使非线性本地执行；再 row-split 第二层权重，出口对 partial sums 做归约。</text>
  <text class="h" x="60" y="145">Global operator</text>
  <g transform="translate(80 175)"><rect class="tensor" width="210" height="155"/><text class="h" x="83" y="68">X</text><text class="b" x="62" y="100">[T,H]</text></g><text class="t" x="315" y="260">×</text>
  <g transform="translate(370 175)"><rect class="tensor" width="360" height="155"/><rect class="c0" x="2" y="2" width="88" height="151"/><rect class="c1" x="91" y="2" width="88" height="151"/><rect class="c2" x="180" y="2" width="88" height="151"/><rect class="c3" x="269" y="2" width="89" height="151"/><text class="h" x="168" y="68">A</text><text class="b" x="137" y="100">[H,4H]</text><text class="axis" x="98" y="142">column axis → A₀ A₁ A₂ A₃</text></g><text class="t" x="755" y="260">=</text>
  <g transform="translate(810 175)"><rect class="tensor" width="360" height="155"/><rect class="c0" x="2" y="2" width="88" height="151"/><rect class="c1" x="91" y="2" width="88" height="151"/><rect class="c2" x="180" y="2" width="88" height="151"/><rect class="c3" x="269" y="2" width="89" height="151"/><text class="h" x="168" y="68">Y</text><text class="b" x="137" y="100">[T,4H]</text><text class="axis" x="90" y="142">Y = concat(Y₀,Y₁,Y₂,Y₃)</text></g><rect class="local" x="1215" y="175" width="325" height="155" rx="5"/><text class="h" x="1270" y="216">rank i local</text><text class="b" x="1250" y="250">Yᵢ = XAᵢ</text><text class="b" x="1250" y="278">Hᵢ = GeLU(Yᵢ)</text><text class="s" x="1250" y="304">Aᵢ:[H,H] · Hᵢ:[T,H]</text><path class="parr" d="M1170 252H1205"/>
  <line x1="60" y1="385" x2="1540" y2="385" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="430">Row-parallel projection：input features 被切，输出是 partial sum</text>
  <g transform="translate(80 465)"><rect class="tensor" width="360" height="135"/><rect class="c0" x="2" y="2" width="88" height="131"/><rect class="c1" x="91" y="2" width="88" height="131"/><rect class="c2" x="180" y="2" width="88" height="131"/><rect class="c3" x="269" y="2" width="89" height="131"/><text class="h" x="165" y="58">H</text><text class="b" x="118" y="92">[H₀|H₁|H₂|H₃]</text></g><text class="t" x="465" y="545">×</text>
  <g transform="translate(520 465)"><rect class="tensor" width="235" height="135"/><rect class="c0" x="2" y="2" width="231" height="31"/><rect class="c1" x="2" y="34" width="231" height="31"/><rect class="c2" x="2" y="66" width="231" height="31"/><rect class="c3" x="2" y="98" width="231" height="35"/><text class="h" x="108" y="60">B</text><text class="b" x="69" y="90">[B₀;B₁;B₂;B₃]</text><text class="axis" x="60" y="122">row axis ↓</text></g><path class="arr" d="M755 532H825"/>
  <rect class="comm" x="840" y="450" width="430" height="165" rx="5"/><text class="h" x="895" y="492">rank i：Zᵢ = HᵢBᵢ</text><text class="t" x="900" y="550">Z = Σᵢ Zᵢ</text><text class="b" x="895" y="585">All-Reduce / Reduce-Scatter</text><path class="arr" d="M1270 532H1340"/>
  <g transform="translate(1350 465)"><rect class="tensor" width="190" height="135"/><text class="h" x="82" y="58">Z</text><text class="b" x="57" y="91">[T,H]</text></g>
  <rect class="note" x="80" y="680" width="1460" height="115" rx="5"/><text class="b" x="110" y="716">每 rank：Aᵢ、Bᵢ 参数约 1/p；GEMM FLOPs 约 1/p。通信 tensor 是 [T,H] activation，不是参数 Ψ。</text><text class="s" x="110" y="748">column split 让 GeLU / independent heads 在 Yᵢ 上本地执行；若先产生 partial pre-activation，非线性前就必须归约。</text><text class="s" x="110" y="778">失效：local GEMM 太小、H/head 不可整除、decode 的小 T 放大 collective latency，或与相邻 layout 产生额外 reshard。</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · tensor 表达参考 Colossal-AI 的 C=AB column-splitting 讲法并扩展到 Megatron column→row 配对</text>
</svg>
