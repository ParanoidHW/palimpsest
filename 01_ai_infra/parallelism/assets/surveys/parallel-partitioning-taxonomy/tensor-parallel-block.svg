<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="tp-title tp-desc">
  <title id="tp-title">Tensor Parallel column 到 row 并行数据流</title><desc id="tp-desc">展示 column-parallel、局部非线性或 attention head、row-parallel 和出口归约。</desc>
  <defs><marker id="tp-arrow-o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker><marker id="tp-arrow-p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7653b5"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.box{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.local{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.layout{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.sync{fill:#fff0f0;stroke:#d64b4b;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:5;marker-end:url(#tp-arrow-o)}.parr{fill:none;stroke:#7653b5;stroke-width:4;marker-end:url(#tp-arrow-p)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">TP：把同步放到非线性之后</text><text class="st" x="70" y="101">column-parallel → local nonlinearity / heads → row-parallel → reduce；示例 p=4。</text>
  <rect class="note" x="70" y="170" width="210" height="105" rx="6"/><text class="h" x="105" y="213">复制输入 X</text><text class="s" x="97" y="245">[B,S,H] on all ranks</text><path class="parr" d="M280 222H365"/>
  <rect class="layout" x="380" y="150" width="260" height="145" rx="6"/><text class="h" x="410" y="190">Column Parallel</text><text class="b" x="410" y="225">Yᵢ = X Aᵢ</text><text class="s" x="410" y="258">按输出维切权重</text><path class="parr" d="M640 222H725"/>
  <rect class="local" x="740" y="150" width="260" height="145" rx="6"/><text class="h" x="770" y="190">Local</text><text class="b" x="770" y="225">GeLU(Yᵢ) / headᵢ</text><text class="s" x="770" y="258">无 collective</text><path class="parr" d="M1000 222H1085"/>
  <rect class="layout" x="1100" y="150" width="260" height="145" rx="6"/><text class="h" x="1130" y="190">Row Parallel</text><text class="b" x="1130" y="225">Zᵢ = Yᵢ Bᵢ</text><text class="s" x="1130" y="258">产生 partial sum</text>
  <text class="h" x="70" y="375">rank-local 数据流</text>
  <g><rect class="box" x="100" y="410" width="255" height="110" rx="6"/><rect class="box" x="390" y="410" width="255" height="110" rx="6"/><rect class="box" x="680" y="410" width="255" height="110" rx="6"/><rect class="box" x="970" y="410" width="255" height="110" rx="6"/>
  <text class="b" x="135" y="449">rank 0 · A₀/B₀</text><text class="b" x="425" y="449">rank 1 · A₁/B₁</text><text class="b" x="715" y="449">rank 2 · A₂/B₂</text><text class="b" x="1005" y="449">rank 3 · A₃/B₃</text>
  <text class="s" x="135" y="483">约 1/p GEMM FLOPs</text><text class="s" x="425" y="483">约 1/p GEMM FLOPs</text><text class="s" x="715" y="483">约 1/p GEMM FLOPs</text><text class="s" x="1005" y="483">约 1/p GEMM FLOPs</text></g>
  <path class="arr" d="M225 520V585H1100V520"/><rect class="sync" x="405" y="560" width="640" height="72" rx="6"/><text class="h" x="590" y="592">All-Reduce / Reduce-Scatter</text><text class="s" x="545" y="617">恢复 Z = Σᵢ Zᵢ；通信载荷是 activation，不是 Ψ</text>
  <rect class="note" x="100" y="680" width="1260" height="110" rx="6"/><text class="b" x="130" y="717">为什么是 column → row？</text><text class="s" x="130" y="748">若第一 GEMM 按输入维切，非线性前就必须先归约 partial sums；按输出维切后，GeLU 或独立 attention heads 可完全本地执行。</text><text class="s" x="130" y="777">失效信号：local GEMM 过小、hidden/head 不可整除、每层 collective latency 或跨节点带宽进入关键路径。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · 推理 decode 时小 batch/token 会进一步放大 collective latency</text>
</svg>
