<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="uly2-title uly2-desc">
  <title id="uly2-title">Ulysses 的 sequence-head tensor transpose</title><desc id="uly2-desc">用 S 乘 A 网格展示 sequence row shards 经 all-to-all 变为 head column shards。</desc>
  <defs><marker id="uly2-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.axis{font-size:14px;fill:#7653b5}.grid{fill:#fff;stroke:#7653b5;stroke-width:3}.c0{fill:#cfe6ff}.c1{fill:#dff3e5}.c2{fill:#f2e7ff}.c3{fill:#ffe5cd}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.compute{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#uly2-arr)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">Ulysses：All-to-All 把 S-row ownership 转成 A-column ownership</text><text class="st" x="60" y="94">把 Q/K/V 的两个逻辑轴画成网格。每个 cell 代表 [B,S/p,A/p,dₕ]；颜色表示最终负责该 cell 的 rank。</text>
  <text class="h" x="60" y="145">Before attention · sequence shards</text><text class="axis" x="95" y="182">S axis ↓</text><text class="axis" x="360" y="182">A axis →</text>
  <g transform="translate(90 200)"><rect class="grid" width="440" height="360"/><g class="c0"><rect x="2" y="2" width="109" height="88"/><rect x="112" y="2" width="109" height="88"/><rect x="222" y="2" width="109" height="88"/><rect x="332" y="2" width="106" height="88"/></g><g class="c1"><rect x="2" y="91" width="109" height="88"/><rect x="112" y="91" width="109" height="88"/><rect x="222" y="91" width="109" height="88"/><rect x="332" y="91" width="106" height="88"/></g><g class="c2"><rect x="2" y="180" width="109" height="88"/><rect x="112" y="180" width="109" height="88"/><rect x="222" y="180" width="109" height="88"/><rect x="332" y="180" width="106" height="88"/></g><g class="c3"><rect x="2" y="269" width="109" height="89"/><rect x="112" y="269" width="109" height="89"/><rect x="222" y="269" width="109" height="89"/><rect x="332" y="269" width="106" height="89"/></g><text class="b" x="150" y="48">rank 0 owns S₀</text><text class="b" x="150" y="137">rank 1 owns S₁</text><text class="b" x="150" y="226">rank 2 owns S₂</text><text class="b" x="150" y="315">rank 3 owns S₃</text></g><text class="b" x="120" y="595">Qᵣ,Kᵣ,Vᵣ : [B,S/p,A,dₕ]</text>
  <path class="arr" d="M530 380H650"/><rect class="comm" x="665" y="260" width="270" height="240" rx="5"/><text class="h" x="710" y="305">All-to-All #1</text><text class="t" x="715" y="360">transpose</text><text class="h" x="765" y="395">S ↔ A</text><text class="b" x="700" y="425">row shards → column shards</text><text class="s" x="700" y="458">不是 sum；只改变 tensor owner</text><text class="s" x="700" y="482">每 rank send/recv p chunks</text><path class="arr" d="M935 380H1050"/>
  <text class="h" x="1050" y="145">Inside attention · head shards</text><text class="axis" x="1080" y="182">S axis ↓</text><text class="axis" x="1350" y="182">A axis →</text>
  <g transform="translate(1070 200)"><rect class="grid" width="440" height="360"/><g class="c0"><rect x="2" y="2" width="109" height="88"/><rect x="2" y="91" width="109" height="88"/><rect x="2" y="180" width="109" height="88"/><rect x="2" y="269" width="109" height="89"/></g><g class="c1"><rect x="112" y="2" width="109" height="88"/><rect x="112" y="91" width="109" height="88"/><rect x="112" y="180" width="109" height="88"/><rect x="112" y="269" width="109" height="89"/></g><g class="c2"><rect x="222" y="2" width="109" height="88"/><rect x="222" y="91" width="109" height="88"/><rect x="222" y="180" width="109" height="88"/><rect x="222" y="269" width="109" height="89"/></g><g class="c3"><rect x="332" y="2" width="106" height="88"/><rect x="332" y="91" width="106" height="88"/><rect x="332" y="180" width="106" height="88"/><rect x="332" y="269" width="106" height="89"/></g><text class="s" x="30" y="338">rank 0</text><text class="s" x="140" y="338">rank 1</text><text class="s" x="250" y="338">rank 2</text><text class="s" x="358" y="338">rank 3</text></g><text class="b" x="1100" y="595">Qᵣ,Kᵣ,Vᵣ : [B,S,A/p,dₕ]</text>
  <rect class="compute" x="1070" y="635" width="440" height="95" rx="5"/><text class="h" x="1130" y="672">Oᵣ = Attention(Qᵣ,Kᵣ,Vᵣ)</text><text class="b" x="1160" y="706">[B,S,A/p,dₕ] · exact attention</text><path class="arr" d="M1070 682H940"/>
  <rect class="comm" x="665" y="635" width="270" height="95" rx="5"/><text class="h" x="720" y="674">All-to-All #2</text><text class="b" x="710" y="708">[B,S/p,A,dₕ]</text><path class="arr" d="M665 682H530"/>
  <rect class="note" x="90" y="650" width="440" height="110" rx="5"/><text class="b" x="120" y="686">约 1/p attention FLOPs</text><text class="s" x="120" y="716">峰值另含 transpose buffers / workspace</text><text class="s" x="120" y="744">要求 heads 可分；A2A fabric 是关键约束</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · 网格同时表达 tensor shape、切分轴和 rank ownership</text>
</svg>
