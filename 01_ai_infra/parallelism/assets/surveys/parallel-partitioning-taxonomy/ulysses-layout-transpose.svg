<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="uly-title uly-desc">
  <title id="uly-title">Ulysses sequence-head layout transpose</title><desc id="uly-desc">展示 B,S/p,A,dh 到 B,S,A/p,dh 以及返回的两次 all-to-all。</desc>
  <defs><marker id="uly-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.layout{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.compute{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:5;marker-end:url(#uly-arrow)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}.cell1{fill:#cfe6ff}.cell2{fill:#e8dafd}.cell3{fill:#dff3e5}.cell4{fill:#ffe5cd}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">Ulysses：用两次 All-to-All 交换 sequence 与 head ownership</text><text class="st" x="70" y="101">[B,S/p,A,dₕ] ↔ [B,S,A/p,dₕ]；attention kernel 保持标准语义。</text>
  <text class="h" x="80" y="165">进入 attention 前：按 sequence 切</text><rect class="layout" x="80" y="185" width="400" height="300" rx="6"/>
  <g transform="translate(115 225)"><rect class="cell1" x="0" y="0" width="330" height="48"/><rect class="cell2" x="0" y="55" width="330" height="48"/><rect class="cell3" x="0" y="110" width="330" height="48"/><rect class="cell4" x="0" y="165" width="330" height="48"/><text class="b" x="22" y="31">rank 0 · S₀ · all A heads</text><text class="b" x="22" y="86">rank 1 · S₁ · all A heads</text><text class="b" x="22" y="141">rank 2 · S₂ · all A heads</text><text class="b" x="22" y="196">rank 3 · S₃ · all A heads</text></g>
  <path class="arr" d="M480 335H625"/><rect class="comm" x="640" y="250" width="300" height="170" rx="6"/><text class="h" x="700" y="295">All-to-All #1</text><text class="b" x="688" y="333">sequence → heads</text><text class="s" x="675" y="365">Q/K/V 分块互换 owner</text><text class="s" x="675" y="392">对 all-to-all fabric 敏感</text><path class="arr" d="M940 335H1085"/>
  <text class="h" x="1090" y="165">attention 内：按 heads 切</text><rect class="layout" x="1090" y="185" width="420" height="300" rx="6"/>
  <g transform="translate(1125 225)"><rect class="cell1" x="0" y="0" width="350" height="48"/><rect class="cell2" x="0" y="55" width="350" height="48"/><rect class="cell3" x="0" y="110" width="350" height="48"/><rect class="cell4" x="0" y="165" width="350" height="48"/><text class="b" x="22" y="31">rank 0 · full S · heads A₀</text><text class="b" x="22" y="86">rank 1 · full S · heads A₁</text><text class="b" x="22" y="141">rank 2 · full S · heads A₂</text><text class="b" x="22" y="196">rank 3 · full S · heads A₃</text></g>
  <path class="arr" d="M1300 485V555H805"/><rect class="compute" x="1040" y="530" width="470" height="85" rx="6"/><text class="b" x="1090" y="565">Local exact attention：约 1/p attention FLOPs</text><text class="s" x="1090" y="592">每 rank 看 full S，但只算 A/p heads</text>
  <rect class="comm" x="600" y="530" width="405" height="85" rx="6"/><text class="b" x="690" y="565">All-to-All #2</text><text class="s" x="650" y="592">heads → sequence，恢复 [B,S/p,A,dₕ]</text><path class="arr" d="M600 572H480"/>
  <rect class="note" x="80" y="675" width="1430" height="100" rx="6"/><text class="b" x="110" y="712">内存：attention activation/workspace 约随 S/p 分摊，但 transpose buffer 与通信 workspace 必须计峰值。</text><text class="s" x="110" y="744">失效条件：A 不能合理分片、all-to-all 跨 oversubscribed fabric、uneven heads 负载不均。Decode 时 full-history KV 与单 token Q 的布局需单独建模。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · B=batch，S=sequence，A=heads，dₕ=head dimension</text>
</svg>
