<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ep2-title ep2-desc">
  <title id="ep2-title">Expert Parallel 的 token tensor permutation</title><desc id="ep2-desc">以 token tensor rows、router permutation、rank-local packed tensor 和 inverse permutation 表达 EP。</desc>
  <defs><marker id="ep2-arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:18px;fill:#566176}.h{font-size:22px;font-weight:700}.b{font-size:17px}.s{font-size:14px}.tensor{fill:#f8fbff;stroke:#2474c6;stroke-width:2}.c0{fill:#cfe6ff}.c1{fill:#dff3e5}.c2{fill:#f2e7ff}.c3{fill:#ffe5cd}.hot{fill:#fff0f0;stroke:#d64b4b;stroke-width:3}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.expert{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#ep2-arr)}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="60" y="60">EP：All-to-All 是 token tensor 的 permutation</text><text class="st" x="60" y="94">全局 token tensor X[T,H] 的 rows 按 expert owner 重排；local expert 计算后用 π⁻¹ 恢复原 token 顺序。</text>
  <text class="h" x="60" y="145">原始 tensor（按 data/sequence owner）</text><g transform="translate(80 175)"><rect class="tensor" width="280" height="300"/><rect class="c0" x="2" y="2" width="276" height="72"/><rect class="c1" x="2" y="75" width="276" height="72"/><rect class="c2" x="2" y="148" width="276" height="72"/><rect class="c3" x="2" y="221" width="276" height="77"/><text class="h" x="118" y="132">X</text><text class="b" x="94" y="162">[T,H]</text><text class="s" x="22" y="40">t0…t3</text><text class="s" x="22" y="113">t4…t7</text><text class="s" x="22" y="186">t8…t11</text><text class="s" x="22" y="260">t12…t15</text></g><path class="arr" d="M360 325H445"/>
  <rect class="comm" x="460" y="200" width="280" height="250" rx="5"/><text class="h" x="515" y="243">router + π(X)</text><text class="b" x="495" y="280">e(t)=top-k(router(t))</text><text class="b" x="495" y="320">X̂ = A2A(pack(X,e))</text><text class="s" x="495" y="355">row ownership:</text><text class="s" x="495" y="383">data rank → expert rank</text><text class="s" x="495" y="415">payload ∝ Tᵣ·H·q</text><path class="arr" d="M740 325H825"/>
  <text class="h" x="825" y="145">expert-owner packed tensors</text>
  <g transform="translate(830 175)"><rect class="tensor" x="0" y="0" width="280" height="62"/><rect class="c0" x="2" y="2" width="276" height="58"/><text class="b" x="24" y="38">rank 0 · X̂₀[4,H] · E0,E1</text><rect class="hot" x="0" y="75" width="390" height="100"/><text class="b" x="24" y="112">rank 1 · X̂₁[7,H] · E2,E3</text><text class="s" x="24" y="145">HOT：max Tᵣ 决定 step time</text><rect class="tensor" x="0" y="188" width="245" height="55"/><rect class="c2" x="2" y="190" width="241" height="51"/><text class="b" x="24" y="222">rank 2 · X̂₂[3,H]</text><rect class="tensor" x="0" y="256" width="210" height="55"/><rect class="c3" x="2" y="258" width="206" height="51"/><text class="b" x="24" y="290">rank 3 · X̂₃[2,H]</text></g>
  <path class="arr" d="M1225 325H1300"/><rect class="expert" x="1315" y="200" width="225" height="250" rx="5"/><text class="h" x="1345" y="242">local GEMM</text><text class="b" x="1345" y="282">Ŷᵣ = Expertᵣ(X̂ᵣ)</text><text class="s" x="1345" y="318">X̂ᵣ:[Tᵣ,H]</text><text class="s" x="1345" y="348">Wᵣ:[E/p,H,4H]</text><text class="s" x="1345" y="378">Ŷᵣ:[Tᵣ,H]</text><text class="s" x="1345" y="415">grouped GEMM efficiency</text>
  <line x1="60" y1="530" x2="1540" y2="530" stroke="#d7dde7" stroke-width="2"/><text class="h" x="60" y="575">恢复 token 语义</text>
  <rect class="comm" x="80" y="610" width="600" height="125" rx="5"/><text class="t" x="120" y="660">Y = π⁻¹(A2A(Ŷ))</text><text class="b" x="120" y="700">输出重新按原 token index 排列，再按 router weights combine</text><path class="arr" d="M680 672H780"/>
  <g transform="translate(795 610)"><rect class="tensor" width="260" height="125"/><rect class="c0" x="2" y="2" width="256" height="29"/><rect class="c1" x="2" y="32" width="256" height="29"/><rect class="c2" x="2" y="62" width="256" height="29"/><rect class="c3" x="2" y="92" width="256" height="31"/><text class="h" x="112" y="57">Y</text><text class="b" x="93" y="87">[T,H]</text></g>
  <rect class="note" x="1100" y="590" width="440" height="165" rx="5"/><text class="b" x="1130" y="628">状态：expert weights ≈ Ψexpert/p</text><text class="s" x="1130" y="660">workspace：pack index + capacity padding</text><text class="s" x="1130" y="690">+ A2A send/recv + max-rank activation</text><text class="s" x="1130" y="720">失效：热点、drop、小包、跨节点拥塞</text>
  <text class="s" x="60" y="875">教学整理图（analysis-derived），非论文原图 · 矩形高度编码 routed-token rows，热点 rank 的 tensor 更高</text>
</svg>
