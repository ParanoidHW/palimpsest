<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="ep-title ep-desc">
  <title id="ep-title">Expert Parallel token routing</title><desc id="ep-desc">展示 token route、all-to-all dispatch、local expert、inverse route 与热点 rank。</desc>
  <defs><marker id="ep-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#e87927"/></marker></defs>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#172033;letter-spacing:0}.t{font-size:34px;font-weight:700}.st{font-size:19px;fill:#566176}.h{font-size:23px;font-weight:700}.b{font-size:18px}.s{font-size:15px}.token{fill:#f2ecff;stroke:#7653b5;stroke-width:2}.expert{fill:#e8f2ff;stroke:#2474c6;stroke-width:2}.hot{fill:#fff0f0;stroke:#d64b4b;stroke-width:3}.comm{fill:#fff3e7;stroke:#e87927;stroke-width:2}.arr{fill:none;stroke:#e87927;stroke-width:4;marker-end:url(#ep-arrow)}.good{fill:#eaf7ee;stroke:#2f9254;stroke-width:2}.note{fill:#f7f9fc;stroke:#d7dde7;stroke-width:2}</style>
  <rect width="1600" height="900" fill="#fff"/><text class="t" x="70" y="65">EP：切 experts，也必须重排 tokens</text><text class="st" x="70" y="101">router ownership → all-to-all dispatch → local experts → inverse all-to-all；瓶颈看 max-rank，不看平均 rank。</text>
  <text class="h" x="75" y="165">原始 token layout</text><g><rect class="token" x="80" y="190" width="260" height="62" rx="6"/><rect class="token" x="80" y="265" width="260" height="62" rx="6"/><rect class="token" x="80" y="340" width="260" height="62" rx="6"/><rect class="token" x="80" y="415" width="260" height="62" rx="6"/><text class="b" x="110" y="229">rank 0: t0 t1 t2 t3</text><text class="b" x="110" y="304">rank 1: t4 t5 t6 t7</text><text class="b" x="110" y="379">rank 2: t8 t9 t10 t11</text><text class="b" x="110" y="454">rank 3: t12 t13 t14 t15</text></g>
  <path class="arr" d="M340 330H470"/><rect class="comm" x="485" y="225" width="270" height="205" rx="6"/><text class="h" x="535" y="270">All-to-All</text><text class="b" x="525" y="310">按 expert owner 打包</text><text class="s" x="525" y="345">载荷 ≈ routed tokens</text><text class="s" x="525" y="375">× hidden × q</text><text class="s" x="525" y="405">每个 MoE layer 两次</text><path class="arr" d="M755 330H875"/>
  <text class="h" x="890" y="165">expert-owner layout</text><g><rect class="expert" x="885" y="190" width="420" height="62" rx="6"/><rect class="hot" x="885" y="265" width="520" height="62" rx="6"/><rect class="expert" x="885" y="340" width="360" height="62" rx="6"/><rect class="expert" x="885" y="415" width="360" height="62" rx="6"/><text class="b" x="915" y="229">rank 0 · experts {E0,E1} · 4 tokens</text><text class="b" x="915" y="304">rank 1 · experts {E2,E3} · 7 tokens · HOT</text><text class="b" x="915" y="379">rank 2 · experts {E4,E5} · 3 tokens</text><text class="b" x="915" y="454">rank 3 · experts {E6,E7} · 2 tokens</text></g>
  <path class="arr" d="M1100 480V540H610"/><rect class="comm" x="485" y="515" width="610" height="65" rx="6"/><text class="b" x="555" y="555">Inverse All-to-All：输出回到原 token 顺序，再做 combine</text>
  <rect class="good" x="80" y="635" width="625" height="125" rx="6"/><text class="h" x="110" y="674">模型状态与计算</text><text class="s" x="110" y="706">expert weights 约 Ψexpert/p；dense layers 通常复制或另用 TP/DP。</text><text class="s" x="110" y="736">理想 expert FLOPs 约 1/p；真实 step time 由 max routed tokens 决定。</text>
  <rect class="note" x="735" y="635" width="670" height="125" rx="6"/><text class="h" x="765" y="674">失效条件</text><text class="s" x="765" y="706">热点 expert、capacity overflow/drop、小包碎片、跨节点 all-to-all 拥塞。</text><text class="s" x="765" y="736">推理还受小 batch、expert cache 与请求间负载抖动影响。</text>
  <text class="s" x="70" y="868">教学整理图（analysis-derived），非论文原图 · capacity factor 改变通信、空转与质量，不能只作为算法超参数处理</text>
</svg>
